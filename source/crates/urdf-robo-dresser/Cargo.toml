[package]
name = "urdf-robo-dresser"
version = "0.1.29"
edition = "2021"
license = "MIT-0"
description = "Programmatic URDF robot-tool merging: dress industrial robots with end-effectors from a catalogue"

[lib]
name = "urdf_robo_dresser"
path = "src/lib.rs"

[[bin]]
name = "urdf-robo-dresser"
path = "src/main.rs"

[dependencies]
quick-xml = "0.42"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"
parry3d = "0.17"

# Feature-gated dependencies
tokio = { version = "1", features = ["full"], optional = true }
# Axum 0.8 + utoipa 6 + utoipa-swagger-ui 10 is the matched set the
# fitting-room also uses; staying on it keeps both servers's wire layers
# binary-compatible and lets us reuse the cross-crate client wholesale.
# (utoipa-swagger-ui 10 is the first release whose build-time `zip` has
# the 2026 extraction advisories fixed.)
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
# "compression-gzip" matters a great deal over a remote tunnel: the catalogue's
# meshes are ASCII OBJ/MTL text, which gzip shrinks ~5-6x. gzip only, not brotli
# — it reuses flate2, already in the lockfile via `zip`, where brotli would add
# a crate for roughly one extra turn of ratio.
tower-http = { version = "0.6", features = ["cors", "set-header", "compression-gzip"], optional = true }
# SPA embedding + content-type detection, mirroring the fitting-room's static
# serving (include_dir! bundle + mime_guess). No tower-http "fs" feature: the
# /assets byte route is hand-rolled through AppState::resolve_asset.
include_dir = { version = "0.7", optional = true }
mime_guess = { version = "2", optional = true }
utoipa = { version = "6", features = ["axum_extras"], optional = true }
utoipa-swagger-ui = { version = "10", features = ["axum"], optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
zip = { version = "9.0.5", default-features = false, features = ["deflate"], optional = true }
# Every OpenAPI operation as an MCP tool, answered by the router in process.
openapi-mcp = { path = "../openapi-mcp", optional = true }

[features]
# Default-on: a plain `cargo build` / `cargo run` produces the
# full-featured binary (CLI + REST server with MCP beside it). To get the
# slim CLI-only build (no axum/tokio/utoipa in the dep graph) pass
# `--no-default-features`.
default = ["server", "mcp"]
server = ["tokio", "axum", "tower", "tower-http", "include_dir", "mime_guess", "utoipa", "utoipa-swagger-ui", "uuid", "zip"]
# MCP beside the REST API: when an MCP client spawns `serve` (stdin is
# not a terminal), it also speaks MCP on stdin/stdout, every OpenAPI
# operation as a tool (src/mcp.rs).
mcp = ["server", "dep:openapi-mcp"]
viewer = []
full = ["server", "viewer"]
# Opt-in test feature: enables `tests/real_assets.rs` which dresses real
# robot+tool URDFs from the in-repo `../assets/` catalogue. The catalogue
# is vendor-specific and will NOT ship with the open-source release; drop
# `--features real-assets` from CI when those URDFs are pruned. Tests
# inside skip gracefully if individual files are missing.
real-assets = []

[dev-dependencies]
proptest = "1"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
pretty_assertions = "1"
# tests/mcp.rs: rmcp's client (the facade's rmcp, client side on) drives a spawned `serve`.
rmcp = { version = "3.6", default-features = false, features = ["client", "transport-async-rw"] }

# The requirements spec: one test per requirement, the unimplemented ones as todo!(). Not part of
# the default `cargo test` (it fails by design); run it with `cargo test --test requirements`.
[[test]]
name = "requirements"
path = "tests/requirements.rs"
test = false
