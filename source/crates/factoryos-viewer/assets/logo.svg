<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Physical AI Production Designer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241a52"/>
      <stop offset="0.55" stop-color="#4b2fd6"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#eafff9"/>
      <stop offset="0.35" stop-color="#7ff3ff"/>
      <stop offset="1" stop-color="#7ff3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#sheen)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="50.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- hexagonal "cell" -->
  <polygon points="128,44 196,84 196,168 128,208 60,168 60,84"
           fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
  <polygon points="128,62 180,92 180,160 128,190 76,160 76,92"
           fill="#ffffff" fill-opacity="0.04"/>

  <!-- agentic planning path: nodes + branch -->
  <g stroke="#8becff" stroke-opacity="0.9" stroke-width="3" fill="#8becff">
    <polyline points="74,120 96,104 120,112" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.55"/>
    <circle cx="74" cy="120" r="4.5"/>
    <circle cx="96" cy="104" r="4.5"/>
    <circle cx="120" cy="112" r="4.5"/>
  </g>

  <!-- robot arm -->
  <g fill="none" stroke="#eef2ff" stroke-linecap="round" stroke-linejoin="round">
    <!-- base -->
    <rect x="78" y="188" width="44" height="14" rx="6" fill="#eef2ff" stroke="none"/>
    <!-- lower + upper links -->
    <path d="M100 190 L112 140 L166 116" stroke-width="15"/>
    <!-- wrist / tool toward the weld -->
    <path d="M166 116 L190 104" stroke-width="11"/>
    <!-- joints -->
    <circle cx="100" cy="190" r="10" fill="#4b2fd6" stroke-width="6"/>
    <circle cx="112" cy="140" r="9" fill="#4b2fd6" stroke-width="6"/>
    <circle cx="166" cy="116" r="8" fill="#4b2fd6" stroke-width="5"/>
  </g>

  <!-- weld spark at the TCP -->
  <circle cx="196" cy="101" r="26" fill="url(#spark)"/>
  <g stroke="#eafff9" stroke-width="3" stroke-linecap="round">
    <line x1="196" y1="83" x2="196" y2="74"/>
    <line x1="196" y1="119" x2="196" y2="128"/>
    <line x1="178" y1="101" x2="169" y2="101"/>
    <line x1="214" y1="101" x2="223" y2="101"/>
  </g>
  <circle cx="196" cy="101" r="6.5" fill="#ffffff"/>
</svg>
