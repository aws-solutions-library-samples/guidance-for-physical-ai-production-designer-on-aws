[package]
name = "factoryos-protocol"
version = "0.1.29"
edition = "2024"
rust-version = "1.96"
publish = false

# Wire types shared by factoryos-backend and factoryos-viewer (native and wasm).
# Keep this crate free of anything that doesn't build for wasm32-unknown-unknown.

[features]
default = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The scene file's YAML round trip (the backend reads and writes it with serde_yaml).
serde_yaml = "0.9"

[lints.rust]
# The internal build's feature, which this export leaves out with the code it gates.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("internal"))'] }
