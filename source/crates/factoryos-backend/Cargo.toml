[package]
name = "factoryos-backend"
version = "0.1.29"
edition = "2024"
rust-version = "1.96"
publish = false

# The Factory OS viewer's single backend: HTTP(S) + WS(S) on one port, an embedded Zenoh router,
# and the subsystems (cell runner, Robo Dresser, Robo Fitter, …) behind it.

[features]
default = []

[dependencies]
# Without its default features: the internal build turns its `internal` on with ours (the public export has neither).
factoryos-protocol = { path = "../factoryos-protocol", default-features = false }

anyhow = "1"
# The Robo Fitter's reach dome and TCP (services/reach): poses of the robot chain.
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
# The planner chat: drives `kiro-cli acp` over ACP, as Rerun's agent panel does.
agent-client-protocol = "2.1"
futures = "0.3.34"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = "0.3.34"
# Workspace IDE terminals (services/terminal.rs): shells in a PTY.
factoryos-pty = { path = "../factoryos-pty" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Task from product: the hash of the product.json a task program was derived from.
sha2 = "0.10"
tokio = { version = "1.53", features = ["full"] }
tokio-tungstenite = "0.29"
# NICE DCV (services/dcv.rs): the reverse proxy to the DCV Connection Gateway on loopback (HTTP/1.1
# with upgrades, its self-signed certificate pinned) and the session tokens.
getrandom = "0.3"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false }
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.6.11", features = ["compression-gzip", "cors", "fs", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

serde_yaml = "0.9"
# URDFs: the services' logic (joints, root link, reach chains) and the meshes a
# scene model references (services/assets.rs).
urdf-rs = "0.9"
# Meshes as binary glTF for the viewers (services/mesh_convert.rs): OBJ+MTL and STL parsing, and
# meshoptimizer's simplifier for the LODs.
meshopt = "0.7"
stl_io = "0.11"
tobj = "4.0"
# The plan2cell.toml of a Control Code Export build (the cell's own, with the request on top).
toml = "0.9"
# Health probes of the Agentic Planning stack (plain HTTP on localhost), and the S3 store
# (src/storage/s3.rs, HTTPS: rustls as the rest of the workspace already builds it).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# The S3 store (src/storage/s3.rs): SigV4 for its requests and presigned URLs, without the whole
# aws-sdk-s3 (the versions already in Cargo.lock).
aws-sigv4 = { version = "1.6.2", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = "1.3.1"
aws-smithy-runtime-api = { version = "1.19.1", features = ["client"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
# Robo Dresser core logic (catalogue, validation, hulls, merge) and the Robo Fitter scene engine:
# the libraries only, without their web servers.
robo-fitting-room = { path = "../robo-fitting-room", default-features = false }
urdf-robo-dresser = { path = "../urdf-robo-dresser", default-features = false }

# Pinned in lockstep: zenoh-ts in the wasm viewer must match the remote-api plugin exactly.
zenoh = { version = "=1.10.1", features = ["internal", "plugins", "unstable"] }
zenoh-plugin-remote-api = { version = "=1.10.1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The tests use its public API only (so `--no-default-features` tests the public build).
factoryos-client = { path = "../factoryos-client", default-features = false }
# Reads the GLBs services/mesh_convert.rs writes back, in its tests.
gltf = "1.4"

[lints.rust]
# The internal build's feature, which this export leaves out with the code it gates.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("internal"))'] }
