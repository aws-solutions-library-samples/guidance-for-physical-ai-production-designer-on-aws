[package]
name = "cell-runner"
version = "0.1.0"
edition = "2024"
license = "MIT-0"

[features]
# Coal-backed collision detection. Disabled by default so the crate still
# builds where Coal (hpp-fcl) is unavailable.
collision = ["dep:gltf", "dep:quick-xml"]

[dependencies]
kuka-krl-parser = { path = "../krl-parser" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
futures = "0.3"
rsruckig = "2.1.3"
nalgebra = "0.33"
indexmap = { version = "2", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gltf = { version = "=1.4.1", default-features = false, features = ["import", "utils"], optional = true }
# Fixture URDF collision geometry (collision feature).
quick-xml = { version = "0.42", optional = true }
# BehaviorTree.CPP (v4 XML) runtime for trajectory plans. MIT; pinned because
# only alpha releases are published.
behaviortree-rs = "=0.2.5-alpha3"

[build-dependencies]
cmake = "0.1"
pkg-config = "0.3"

[dev-dependencies]
proptest = "1"
