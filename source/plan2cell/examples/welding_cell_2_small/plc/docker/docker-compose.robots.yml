      profinet_net:
        ipv4_address: 192.168.100.12
      codemeter_net:
    restart: unless-stopped
    volumes:
      - ./device-r2-config:/etc/codesyscontrol
      - ./device-r2-data:/var/opt/codesys
      - /var/run:/var/run
