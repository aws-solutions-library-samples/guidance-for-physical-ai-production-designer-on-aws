[package]
name = "plan2cell"
description = "Behaviour-tree plan -> head-PLC code and robot programs in one consistent build (bt2plc + bt2krl)"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["check"]
# Type-check the generated ST with trust-platform.
check = ["bt2plc/check"]
# Co-simulate the head PLC with the robots (device ST or the KRL executor): heavy build.
sim = ["check", "bt2plc/sim"]

[dependencies]
bt2plc.workspace = true
bt2krl.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
