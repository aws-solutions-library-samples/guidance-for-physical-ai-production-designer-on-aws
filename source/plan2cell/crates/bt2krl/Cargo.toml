[package]
name = "bt2krl"
description = "bt2plc robot programs -> KUKA KRL (production/home Folge with PLC zone interlocks)"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "bt2krl"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap.workspace = true
thiserror.workspace = true
anyhow.workspace = true

[features]
default = []
# Co-simulation of the IR executor against the head PLC that bt2plc generates (heavy build:
# pulls trust-runtime in through bt2plc).
cosim = ["bt2plc/sim"]

[dev-dependencies]
bt2plc.workspace = true
proptest.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true

[[test]]
name = "cosim"
required-features = ["cosim"]
